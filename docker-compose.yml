services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-fitness-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fitness
      POSTGRES_PASSWORD: fitness_secret
      POSTGRES_DB: ai_fitness_coach
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
